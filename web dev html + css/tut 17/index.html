<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        #uid{
            width: 100%;
            height: 100vh;
            background-color: rgb(172, 216, 37);
            color: rgba(252, 253, 251, 0.992);
        }
        /* child selector is used to select the direct child of an element. It is represented by the ">" symbol. For example, if you have a parent element and you want to style only its direct child elements, you can use the child selector. */
        div > p {
            font-size: 2rem;
            text-align: center;
            color: rgb(0, 0, 0);
            background-color: rgb(255, 255, 255);

        }
        /* decendent selector is used to select elements that are nested within a parent element, regardless of their depth in the hierarchy. It is represented by a space between the parent and child selectors. For example, if you have a parent element and you want to style all its descendant elements, you can use the descendant selector. */

        div article p {
            font-size: 1.5rem;
            text-align: center;
            color: rgb(225, 21, 21);
            background-color: rgb(255, 255, 255);
        }
        /* universal selector is used to select all elements on a web page. It is represented by the "*" symbol. For example, if you want to apply a style to all elements, you can use the universal selector. */ 
*{
    font-family: Arial, sans-serif;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
/* pseudo selectors are used to style specific parts of an element, such as the first letter or first line of text. They are represented by a double colon "::" followed by the name of the pseudo-element. For example, if you want to style the first letter of a paragraph, you can use the ::first-letter pseudo-element. */
a:visited {
    color: purple;
    background-color: yellow;
}
a:active {
    color: red;
    background-color: blue;
}
a:link{
    color: green;
    background-color: orange;
}
a:hover{
    color: white;
    background-color: black;
}
p:first-child {
    font-size: 2rem;
    text-align: center;
    color: rgb(0, 0, 0);
    background-color: rgb(214, 26, 26);
}
</style>

</head>
<body>
    
<div class="vid" id = "uid">
    <p> lorem ipsum dolor sit amet</p>
    <article>
        <h1>Welcome to My Website</h1>
        <p>Lorem ipsum dolor sit amet, consectetur
             adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
             </article>
    <span>lorem ipsum dolor sit amet</span>

<h3>Welcome to My Website</h3>

</div>

<div class="link">

</div>

</html>
